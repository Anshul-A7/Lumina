spring.application.name=smart-notes-api
spring.security.user.name=${SPRING_SECURITY_USERNAME}
spring.security.user.password=${SPRING_SECURITY_PASSWORD}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Multi-Provider AI Configuration (GROQ | GEMINI | OPENAI)
ai.provider=${AI_PROVIDER:GROQ}

# Groq Defaults
groq.api-key=${GROQ_API_KEY:}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Gemini Defaults
gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# OpenAI Defaults
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Spring AI Global Defaults (Fallback)
spring.ai.openai.api-key=${GROQ_API_KEY:${GEMINI_API_KEY:${OPENAI_API_KEY:dummy-key}}}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}
server.forward-headers-strategy=framework

springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.operationsSorter=method

# JWT Configuration
jwt.secret=${JWT_SECRET:bHVtaW5hLWRlZmF1bHQtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1wbGVhc2U=}
jwt.expiration=${JWT_EXPIRATION:1800000}

# Spring Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from-name=${MAIL_FROM_NAME:Lumina}

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:}

# Frontend URL (for password reset links, CORS)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
